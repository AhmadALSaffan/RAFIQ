# Keeps Rafiq's Supabase project awake.
#
# A free Supabase project is paused after about a week without activity, and a paused
# project can't receive GitHub Marketplace events. Reading one row a day is enough to keep
# it awake. The row is public and holds nothing private (cloud/supabase/migrations).
#
# Note: GitHub turns scheduled workflows off in a public repository after 60 days without
# any activity in it; it sends an email, and one click turns this back on.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *" # every day, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read the keep-alive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/keepalive?select=id" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -o /dev/null
          echo "Supabase answered: awake."
