# GitHub Copilot sign-in on a real Mac, run by hand after a macOS build.
#
# Takes the frozen agent from a macOS build run, starts it, and signs in to Copilot the way
# the app does: the job's summary (and log) shows a code to enter at github.com/login/device
# within 15 minutes. Then it lists the models, saves one as an agent, asks it a question in a
# chat, and signs out again, which revokes the token. See .github/scripts/copilot_signin.py.

name: macOS Copilot sign-in

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The macOS build run to test"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  signin:
    name: Copilot sign-in · Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: rafiq-macos
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: build

      - name: Agent
        run: |
          mkdir agent
          tar -xzf build/Rafiq-CLI-macos-arm64.tar.gz -C agent

      # What the updater leaves behind: the package unpacked without its first path part, the
      # way tauri-plugin-updater does, has to be a valid app that starts its agent.
      - name: Updater package
        run: |
          mkdir -p updated/Rafiq.app
          tar -xzf build/Rafiq-macos-arm64.app.tar.gz -C updated/Rafiq.app --strip-components 1
          codesign --verify --deep --verbose=2 updated/Rafiq.app
          open updated/Rafiq.app
          for i in $(seq 1 120); do
            if [ -f "$HOME/.rafiq/agent.json" ]; then break; fi
            sleep 1
          done
          port=$(python3 -c "import json,os;print(json.load(open(os.path.expanduser('~/.rafiq/agent.json')))['port'])")
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$port/health"; then echo; break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$port/health"
          pkill -f "updated/Rafiq.app" || true

      # Like a user's first sign-in: no python.org certificates for the bundled OpenSSL to find
      # (the runner has them), and no Copilot runtime downloaded yet.
      - name: Sign in, ask, sign out
        run: |
          bash .github/scripts/hide_python_certs.sh
          trap 'bash .github/scripts/hide_python_certs.sh restore' EXIT
          rm -rf "$HOME/Library/Caches/github-copilot-sdk"
          env -u SSL_CERT_FILE -u SSL_CERT_DIR python3 .github/scripts/copilot_signin.py agent/rafiq-agent
